# Production stack: the app, its MongoDB, and Caddy for automatic HTTPS.
# All environment-specific values live in a .env file next to this one (never
# committed). Moving to a new server or domain means editing that .env and
# running `docker compose up -d` again — nothing here changes.

services:
  app:
    # Image built and pushed by GitHub Actions. IMAGE is set in .env, e.g.
    # ghcr.io/thefakealexx/cas_website:latest
    image: ${IMAGE}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/cas?authSource=admin
      APP_URL: https://${APP_DOMAIN}
      AUTH_SECRET: ${AUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: https://${APP_DOMAIN}/api/auth/google/callback
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      MAINTAINER_KEYS: ${MAINTAINER_KEYS}
    volumes:
      # Uploaded images must outlive any redeploy, so they live on a volume.
      - uploads:/app/uploads
    networks:
      - web

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    # Deliberately no `ports:` — Mongo is reachable only on the internal
    # network, never from the public internet.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - web

volumes:
  uploads:
  mongo-data:
  caddy-data:
  caddy-config:

networks:
  web:
